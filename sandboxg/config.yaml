# sandboxg — the sandboxd gateway: exposes the same /v1/* protocol to nexus,
# load balances across backends (exec/code) and routes stickily (interactive, by session_id).

# The listen address exposed to nexus.
listen: ":27080"

# Log directory.
log_dir: logs

# Authentication towards nexus (optional, same convention as sandboxd: Authorization: Bearer <token>).
# token: ""

# Interval for pulling backend load snapshots (/v1/metrics), in seconds.
metrics_interval_sec: 2

# Lifetime of an interactive sticky binding, in seconds.
#
# It must exceed sandboxd's interactive_idle_sec + 2× the janitor sweep interval (60s):
#   binding expires before the process → the same session may land on two backends and build a process on each (split
#   state);
#   binding expires after the process → the next open lands on the original backend and lazily creates a new process,
#   costing only one extra record that the TTL eventually clears.
# So err on the long side. sandboxd now defaults to 300, so the hard lower bound is 420 (300 + 2×60); 2100 is kept
# because it also covers a deployment that left interactive_idle_sec at the old 1800, and the cost of a binding that
# outlives the process is one stale record.
# After a kill sandboxd reports session_empty and the gateway unbinds immediately, without relying on this value.
sticky_ttl_sec: 2100

# Health checks: interval for probing a backend's /healthz (seconds) and the number of consecutive failures that marks
# it unhealthy.
health_check_interval_sec: 5
health_check_fail_threshold: 3

# Shared storage for sticky bindings (required for a multi-instance gateway; empty degrades to per-machine memory, for
# testing only).
redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# The token for instances that came from discovery: a registry only yields addresses, so the token is attached here for
# all of them. Instances listed under `backends` use their own `token` field instead, so a discovery-managed deployment
# must set this one.
# sandbox_token: ""

# Service discovery (the source of the backend list). Empty `type` = static `backends` only.
#
# When to use which:
#   static only (type: "")     - one or a few sandboxd instances with fixed addresses. backends is the pool; nothing
#                                else moves it.
#   discovery (type: consul|nacos) - instances come and go. The registry list is authoritative: an instance it does not
#                                list leaves the pool (and its sticky bindings are cleared), so `backends` is only the
#                                initial seed - it keeps the gateway usable before the first pull and while the registry
#                                is unreachable.
#   mixed                       - supported only as "seed + fallback", not as "static always wins": after a successful
#                                pull, a static entry the registry does not list is dropped.
#
# Failure behaviour (both keep the current pool instead of emptying it):
#   a pull that errors, and a pull that succeeds but returns no instance (a rolling restart looks exactly like that).
#   A backend that is really gone is then removed by the health check (health_check_fail_threshold).
discovery:
  type: "consul"                    # consul | nacos
  address: "localhost:8500"
  service_name: "sandboxd"
  interval_sec: 5

# Static pool of sandboxd instances: the only source when discovery.type is empty, the initial seed when it is set.
# url is the HTTP base address (the gateway derives ws and /metrics itself); token authenticates against that instance.
backends:
  - url: http://127.0.0.1:27081
    # token: ""
