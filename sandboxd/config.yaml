# sandboxd — standalone sandbox service configuration
#
# This is the single source of truth for "sandbox resource policy": isolation mode, resource caps, process pools and
# concurrency budgets. The nexus side does not send any of it; it only supplies language names and (optionally) a
# timeout.

# ⚠️ Bind 127.0.0.1 explicitly; do not use ":8080":
#    On Windows, IPv4 port 8080 is often taken by a system service (in this case iphlpsvc's port proxy), while
#    ":8080" can only grab the IPv6 one, so connections to 127.0.0.1 land on the other service →
#    the client sees "TCP connects but the HTTP handshake times out".
listen: "127.0.0.1:27081"
# token must match nexus's sandbox.token; empty means no checking (internal network only)
token: ""

# ---------------------------------------------------------------------------
# Service registration (optional, off by default): register this service with consul/nacos for sandboxg to discover.
# A single instance connected directly (nexus talks to sandboxd) does not need it; only multiple sandboxg instances do.
# Note that service_addr must be an address the gateway can reach (the intranet IP across machines, never 127.0.0.1).
# ---------------------------------------------------------------------------
registry:
  enabled: true
  type: "consul"
  address: "localhost:8500"
  service_name: "sandboxd"
  service_addr: "127.0.0.1"
  service_port: 27081        # defaults to the listen port
  health_check_path: "/healthz"
# Log directory
log_dir: logs

# Interactive detail logging policy: off / slow / all
#
#   A detail record looks like:
#     sandboxd: code <id> done lang=lua reused=true dur=3ms reusable=true
#   — "did this call hit the pool, how long did it take, was the worker dropped".
#   The worker identity only exists on the sandboxd side (nexus cannot see it), and the code id is the join key both
#   sides reconcile on.
#
#   Why a switch: lua is a microsecond-level high-frequency call (loop conditions / branch conditions / binding
#   transforms), and logging every session turns the log into noise.
#   Note: abnormal sessions that cannot be returned (interrupted / timed out / protocol error) are **not** covered by
#   this switch and are always recorded.
#
#   off  — records no normal session at all
#   slow — records only sessions taking >= code_log_slow_ms (the default, recommended in production)
#   all  — records every session (for troubleshooting; that is the stage we are at now)
code_log: all
# Threshold of the slow policy (milliseconds)
code_log_slow_ms: 200

# ⚠️ Three generations of old names exist for this group: script_log / script_log_slow_ms / script_max_sec / script
#   (top-level section), interact_log / interact_log_slow_ms / interact_max_sec / interact (top-level section), and the
#   even older session_log / session_log_slow_ms / session_idle_sec / session (top-level section).
#   The old names are still accepted, but log a "please update the config" warning at startup — see applyLegacyKeys in
#   config.go.

# Isolation mode: none / nsjail / docker — decided here only
#
#   none   no isolation, plain exec (development and debugging only; a warning is logged at startup)
#   nsjail Linux namespace/cgroup isolation, cold start ~10ms (order of magnitude, not measured yet); bring your own
#          rootfs
#   docker container isolation, cold start 300ms~1s (order of magnitude, not measured yet); needs an image
#
# Current mode: none (local development).
# docker uses flame/sandbox:latest built from sandboxd/Dockerfile (Debian 13, with lua5.4 / python3.13 / node24 and
# the common Python packages); nsjail needs a rootfs of its own.
# When switching modes note: the general default of langs.*.command is "the name inside the image / rootfs"; switching
# to none requires overriding it through commands.none with the host path (already configured below).
mode: none

# ---------------------------------------------------------------------------
# Network policy: whether processes inside the sandbox can reach the outside.
#
# What is written here is the **ceiling**, not the fact of one call. Whether this particular call has network access is
# the AND of three layers:
#   deployment ceiling (this file) × tenant permission (net.egress in platform.tenant_capabilities)
#   × request intent (the egress flag carried by the /v1/exec request)
# Startup validates that "the declaration matches how the unit is started" and refuses to start when it does not —
# lying to the agent is worse than misconfiguring it: it would write scripts on a wrong premise (writing pip install
# while believing the network is off, or blaming egress failures on a code bug).
#
#   off          nobody gets egress (a request asking for on is rejected)
#   on-request   off by default, egress only when the request explicitly asks (recommended in production: the only tier
#                that adjudicates per request)
#   on           always egress, requests are ignored
#
# ⚠️ Applies to /v1/exec only (including skill scripts). /v1/code is the managed snippet channel, shared across tenants,
# and the request frame carries no tenant identity — egress could only be switched on for the whole platform with no
# per-tenant fallback, so it is always off and has no config option (mode=none excepted: scripts run on the host, cannot
# be cut off, and capabilities reports on honestly).
# The workflow's egress needs go through the http / rpc / mcp nodes (that is where the domain allowlist, credentials,
# rate limiting and auditing live).
#
# ⚠️ With nsjail, the "egress" branch of on-request needs --disable_clone_newnet in nsjail.extra_args (sharing the host
# network namespace). The program cannot validate extra_args and only warns at startup — it is an escape hatch, so using
# it makes you responsible for the declaration being truthful.
#
# networks overrides by isolation mode (optional). none is a host process and cutting the network off is simply
# impossible — local debugging must declare networks.none: on honestly, otherwise startup fails.
#
# Blind spot: docker.extra_args / nsjail.extra_args can overturn this declaration (stuff in a --network host and you are
# done) and the program cannot check it — if you use the escape hatch, keep the declaration truthful yourself.
# ---------------------------------------------------------------------------
network: on-request
networks:
  # Local debugging: a host process shares the outside network and cannot be cut off, so declare "always egress"
  # honestly.
  # When moving to docker / nsjail in production, delete this line so the top-level on-request takes effect.
  none: on
  # nsjail: off
  # docker: on

# ---------------------------------------------------------------------------
# Sandbox capability probe: at startup a set of independent probes (os / python / node / lua ...) runs inside the
# sandbox, and the result is handed to nexus through /v1/capabilities for injection into the agent.
#
# Why probe instead of declare: what is inside the sandbox is a **fact**, and declarations drift — install a new package
# in the Dockerfile but forget the config, and the agent writes scripts against a wrong environment. The interpreter
# entry names come from langs (resolved per mode) and are not repeated here.
#
# With mode=none no sandbox process is started: the host is probed natively with Go (GOOS/GOARCH + LookPath).
# ---------------------------------------------------------------------------
probe:
  timeout_sec: 30        # overall timeout: probes run concurrently; serially the worst case would add up
  max_output_bytes: 8192 # output cap of a single probe (the result enters the LLM context, so it must be capped)

# ---------------------------------------------------------------------------
# Language definitions: the truth about interpreter entry names, shared by exec (commands / skill scripts) and code
# (workflow snippets).
#
# Why it sits next to code rather than inside it: a language is "which interpreters the sandbox has and what they are
# called", independent of the use case; code only carries "the pool and concurrency policy specific to script
# execution" (see the end of this file). Putting it on the wrong level meant exec could not reuse the same definition
# and the nexus side had to hardcode one of its own — once the two drift you get "the flow runs but the skill does not",
# while "what it is called inside the image" is knowledge only sandboxd has.
#
# ⚠️ The meaning of command changes with the mode; the three modes resolve it in different places:
#     mode: none    → a command the host can resolve (a name on PATH, or a host absolute path)
#     mode: nsjail  → resolved inside the chroot (rootfs) (for example lua5.4 / /usr/bin/lua5.4)
#     mode: docker  → resolved inside the image (this repo's Dockerfile creates the lua -> /usr/bin/lua5.4 symlink)
#
#   The same name does not necessarily exist in all three environments, hence the per-mode override:
#     command: lua            # general default
#     commands:               # optional; wins over the general default when the current mode matches
#       docker: lua
#       nsjail: lua5.4
#       none: "d:/tools/lua5.4/lua54.exe"
#   At startup the final value is resolved for the current mode and logged; when a mode has no commands entry and the
#   general command does not resolve either, startup fails outright (the language is not silently skipped).
#
#   The "locating" fields (commands / codehost.binaries / browser.* / tmp_dir / log_dir / allowed_mount_roots /
#   nsjail.rootfs / docker.image) support ${VAR} expansion: moving to another machine needs no config edit, an
#   environment variable override is enough, for example
#       none: "${FLAME_PYTHON}"
#   ⚠️ Referencing an unset variable fails startup instead of degrading to an empty string — an empty string is taken as
#   "not configured" and silently falls back to the general default, so the override does not take effect with no trace.
# ---------------------------------------------------------------------------
langs:
  lua:
    # The general default is guaranteed by the image (Dockerfile: ln -sf /usr/bin/lua5.4 /usr/local/bin/lua).
    # ⚠️ Under the other two modes this name does not necessarily exist; override it with commands then:
    #     nsjail: if the rootfs only has lua5.4 without the lua symlink, write commands.nsjail: lua5.4
    #     none:   the lua on the host PATH (on Windows usually a version-suffixed filename)
    command: lua
    commands:
      none: "d:/tools/lua5.5/lua55.exe"  # local debugging (adjust to your machine)
  python:
    # The entry name really is different under the three modes, so commands distinguishes them explicitly rather than
    # leaving it to a comment:
    # ⚠️ Do not use the python3.exe under WindowsApps — that is a Microsoft Store alias and fork/exec reports
    #    "The file cannot be accessed by the system".
    command: python                       # general default (currently == commands.docker)
    commands:
      docker: python                      # the image symlinks python -> /usr/bin/python3
      nsjail: python3                     # the rootfs only has python3
      none: "d:/tools/Python313/python.exe"  # local debugging (adjust to your machine)

  # node is not installed locally, so js is disabled for now: under mode=none startup validates that the host can
  # resolve it. Install Node (or switch to docker mode) and uncomment to restore it.
  js:
    # It is called node under all three modes, so no commands override is needed.
    command: node

# Where the codehost host binary lives (shared by none / nsjail / docker).
#
# codehost is the resident host that replaced worker.lua/py/js: sandboxd keeps it alive inside the isolation unit, and
# every execute forks a brand-new interpreter from it (the wrapper templates are embedded).
#
#   binary   general default ("codehost", resolved through PATH);
#   binaries per-mode override — none uses the host path, nsjail the rootfs path, docker the in-image path.
codehost:
  binary: codehost
  binaries:
    none: "D:/proj/flame/sandboxd/bin/codehost.exe"
    nsjail: /usr/local/bin/codehost
    docker: /usr/local/bin/codehost

# ---------------------------------------------------------------------------
# Browser (browserhost + the Chromium inside the sandbox)
#
# The browser is the same kind of thing as a shell: a session-level long-lived process. It therefore reuses the
# /v1/interactive channel (tool_id=browser) and **adds no HTTP route**; this section only describes "where the
# browserhost in the image / rootfs is, and whether headed is possible".
#
# Preconditions (all required):
#   - Chromium is installed in the image / rootfs (see the Dockerfile);
#   - the top-level network is on and docker.network is not none (otherwise pages will not load);
#   - limits' memory and pids are sufficient (Chrome's process tree is an order of magnitude bigger than a shell's).
# ---------------------------------------------------------------------------
browser:
  # Off by default: a browser can reach the network and read page content, a capability "you should know about when you
  # turn it on".
  enabled: true
  binary: browserhost
  binaries:
    none: "D:/proj/flame/sandboxd/bin/browserhost.exe"
    docker: /usr/local/bin/browserhost
    # nsjail is not supported (the rootfs lacks /proc, /dev/shm, fonts and userns):
    # enabling browser.enabled with mode=nsjail fails startup outright.
  # The browser executable (**an in-sandbox** path). Empty = browserhost discovers it itself
  # (chromium inside docker / Chrome or Edge on the host).
  #
  # This path has the same nature as binaries: a host path under none, an in-image path under docker, and one string
  # cannot hold for both — so the effective value goes through exec_paths per mode and falls back to this line when the
  # mode has no entry (the same rule as command/commands in langs).
  exec_path: ""
  exec_paths:
    docker: /usr/bin/chromium
    # none: "C:/Program Files/Google/Chrome/Application/chrome.exe"
    # Empty = autodetect; when both Chrome and Edge are installed locally and you want one of them, write it here.
  # Default display mode: false = headless (recommended in production).
  headed: false
  # Whether a caller may request headed per session (open with headed=true).
  # Headed needs a real display environment and only holds with mode=none (sandboxd running on a machine with a
  # desktop); allowing it under any other mode is a **startup failure** (validateBrowser stops it).
  # Overridable per mode: the value here is used when the current mode matches, otherwise this line applies — one
  # config serves both the local machine (with a desktop) and docker (no window), with no edit when switching modes.
  allow_headed: false
  allow_headed_modes:
    none: true
  # Chrome's user-data-dir (an in-sandbox path).
  # Empty = per-mode default: docker → /tmp/browser (the container has --tmpfs /tmp, so the profile dies with the
  # container); none → a temp directory removed when the browser exits.
  profile_dir: ""
  profile_dirs:
    # docker: /tmp/browser      # that is the default already, so it usually need not be written
  # Download directory (an in-sandbox path). Empty = <cwd>/downloads, that is the workspace, which the file tools can
  # read directly.
  # Once written as an absolute path it only holds for one mode (/workspace under none becomes the host disk root), so
  # it is left empty by default and resolved relative to cwd.
  downloads_dir: ""
  downloads_dirs:
    # docker: /workspace/downloads

  # Resource cap of the browser process (clamped by the global limits afterwards).
  limits:
    memory_mb: 1024

# The worker writable directory (the host-side root): every worker creates an exclusive subdirectory under it, mounts it
# into the sandbox as /tmp, and it is the script's cwd at the same time.
#
# Why it is needed: inside the isolation unit only tmp_dir is a writable mount, so a script writing relative paths fails
# outright; and an nsjail chroot is read-only by default, leaving nowhere for a script's temporary files (Python's
# tempfile and the like) to land.
#
# Startup empties this whole tree; nothing is deleted individually at runtime — so it is not a persistent data
# directory.
# Under mode=none scripts write real paths on the host; under an isolation mode it is confined to the mount point.
tmp_dir: run/tmp

# List of allowed host directory roots: a request's Mounts[].Host must fall under one of them.
# An empty list means no checking (a warning is logged at startup; recommended for development only).
#
# This is "policy", not "domain": sandboxd does not care what the caller's workspace looks like and does not parse its
# business paths, it only ensures the paths it is asked to mount fall inside the authorised range.
# When onboarding a new caller, append one entry here.
#
# The entry must be exactly the host path the caller sees (shared storage with identical paths).
#   production (Linux): /srv/nexus
#   local debugging: the agent.root_dir of nexus/config.yaml
allowed_mount_roots:
  - "D:/proj/flame/nexus/data"

nsjail:
  binary: nsjail
  rootfs: /opt/nsjail/rootfs
  uid: 99999
  gid: 99999
  disable_network: true
  # Read-only rootfs. An nsjail chroot is R/O by default, so true adds no argument; only false adds --rw (writable,
  # normally for debugging only).
  read_only_rootfs: true
  # cgroup version selection: v1 | v2 | auto (auto by default)
  # The memory cap --cgroup_mem_max works under both versions; this only decides the version flag:
  #   v1   no flag, keep nsjail's default (cgroup v1)
  #   v2   --use_cgroupv2 (the host must be v2)
  #   auto --detect_cgroupv2 (use v2 when present, otherwise v1; needs a reasonably recent nsjail)
  cgroup_version: auto
  # Escape hatch: appended to the end of nsjail's native command line.
  # For example, to disable the /proc mount explicitly (nsjail does not mount it by default, so usually unnecessary):
  #   extra_args: ["--disable_proc"]
  extra_args: []

docker:
  binary: docker
  # The image is built from sandboxd/Dockerfile:
  #   docker build -t flame/sandbox:latest -f sandboxd/Dockerfile sandboxd
  #
  # Contract: the three interpreters lua5.4 / python3.13 / node24; Python dependencies
  #   (openpyxl 3.1.5 / xlrd 2.0.1 / pandas 2.2.3 / numpy 2.2.4);
  #   procps (for the pkill follow-up strike) + coreutils (resident sleep); non-root; no ENTRYPOINT.
  # The actual versions inside the image can be checked: docker run --rm flame/sandbox:latest cat /etc/flame-versions
  #
  # ⚠️ Packages can only be added at build time: the container runs with --network none and a read-only rootfs, so pip /
  # npm / luarocks are all unusable at runtime; to get a new package, change the Dockerfile and rebuild the image.
  image: flame/sandbox:latest
  # ⚠️ This is "which network to use when going online": a simplex request carrying egress starts the container with it.
  #    The top-level network is a **ceiling**, not something compared for equality here — but on-request requires this to
  #    really provide a network: an empty value or none leaves "the request wants egress" with nothing to switch to, and
  #    validateNetwork refuses to start.
  #    Allowed values when egress is permitted: bridge / host (none means no network at all).
  #    bridge: the browser tool needs to reach the outside world; for a hard cut, set it back to none and switch the
  #    top-level network to off.
  network: bridge
  read_only: true
  user: "1000:1000"
  extra_args: []

# Global hard cap: every request's final value is clamped to it (0 = that dimension is unlimited)
limits:
  memory_mb: 1024
  cpu_count: 2
  # Chrome's process tree (browser / gpu / renderer / utility) commonly runs to 20+; 64 would kill the container on the
  # pids limit as soon as a couple of tabs are open.
  max_pids: 256
  max_file_mb: 64
  timeout_sec: 300
  max_output_bytes: 4194304

# Cap on the **total duration** of one script execution (seconds): a backstop that keeps a hung connection from holding a
# worker for a long time.
# The clock starts at the open frame and never resets, covering the exec frame and the whole script execution
# (see codeDeadline in handle_code.go).
#    This is the **real hard gate** of workflow script execution: a caller-supplied timeout can only tighten it, never
#    relax it, so configuring the caller-side timeout above 120 is the same as not configuring it.
#    (The old name was session_idle_sec; that "idle" was misleading — this is not "reclaim after being idle".
#     The old name is still accepted, but logs a warning.)
# Before raising it, re-check each language's max_concurrent and idle.max: longer single sessions fill the pool more
# easily, and later requests will hit code.acquire_timeout_sec (or that language's override) and get "busy".
code_max_sec: 120

# ---------------------------------------------------------------------------
# interactive (long-lived interactive processes)
#
# A long-lived interactive process (/v1/interactive) is held by the session and outlives the connection; being idle
# longer than this (counted from the most recent call) makes the background janitor reclaim it — kill the process,
# release the container.
# The difference from code_max_sec: that one is the hard gate of a **single interaction**, this one is the idle backstop
# of a **cross-call resident process**.
#
# Why 5 minutes: a session container is the most expensive idle resource (a resident Chromium alone costs hundreds of
# MB), while the state it keeps barely outlives the task. The browser profile sits in the container's tmpfs and dies
# with it, so a longer idle never preserves logins; and a headed browser — the only case where a human really watches
# the session — exists only under mode=none (local development). Raise it only for that local, human-in-the-loop use.
# ---------------------------------------------------------------------------
interactive_idle_sec: 300

# Short idle backstop of temporary interactive processes without a session (seconds).
#
# A call without a session (a one-shot run) has no need to persist across runs: repeated calls inside a run reuse the
# process by "the gap being far smaller than this value"; at the end of the run nexus kills it proactively (the fast
# path), and this only backstops a nexus crash / a lost notification.
interactive_ephemeral_idle_sec: 120

# Sweep interval of the long-lived interactive registry (seconds): not a timeout, but the "resolution of the timeout".
#
# A process is reclaimed on the first sweep after it went idle, so the actual reclaim time falls in
# (interactive_idle_sec, interactive_idle_sec + this value].
# That upper bound decides the lower bound of sandboxg's sticky TTL: sticky_ttl_sec > idle + 2×janitor_sec.
# This value is reported through the interactive section of /v1/capabilities, and the gateway validates its own config
# against it.
interactive_janitor_sec: 60

# exec (command execution): never pooled, a new process every time
exec:
  limits:
    memory_mb: 512
    timeout_sec: 120

# ---------------------------------------------------------------------------
# code (workflow snippets)
#
# ⚠️ This section only carries "the pool and concurrency policy specific to script execution"; it holds no interpreter
#   entry — those are defined in the top-level langs above (a language is independent of the use case and exec needs it
#   too). Every language named here must have a definition of the same name in the top-level langs, otherwise startup
#   fails.
#
# The pool switch has exactly one level: **whether the whole language entry is there** (pools.<lang>).
#   entry present = that language enables the idle pool and serves requests;
#   to drop it, comment out the **whole** entry — its code requests then get unsupported_lang.
#   There is deliberately no "disable the idle pool but keep the language" tier: its only consequence is a silent
#   performance cliff of a cold start on every call (300ms~1s under docker), while "no prewarming / nothing resident" is
#   already expressible through the idle numbers.
#
# idle.initial / idle.max — the two numbers of the idle pool (objects currently lent out do not count against it):
#   initial guaranteed idle count: prewarmed at startup, maintained by the refiller at runtime; **0 = no prewarming**
#           (legal).
#   max     idle pool capacity: default = initial; 0 = nothing kept resident (destroyed on return).
#   Both omitted = {0, 0}: no prewarming, nothing resident, the pool only starts processes on demand along the request
#           path.
#   ⚠️ initial > max fails at startup (it would leave the refiller spinning "start one, kill one" every second).
#
# The lifecycle tier (the old lifecycle: reuse / restart) has been removed: codehost forks a brand-new interpreter
# process on every execute, so "zero residue across requests" holds by construction and there is no "reuse a warm
# interpreter vs use it once" choice; all three isolation modes (none / nsjail / docker) are "a fresh interpreter per
# request, a resident codehost reused" (whether the container is reused is controlled by idle.max).
# So the return policy has a single tier left: a clean worker is reused, a half-finished one (interrupted / timed out /
# protocol error) is destroyed.
#
# idle.initial is "the guaranteed idle count": prewarmed at startup and maintained by the refiller at runtime (what is
# maintained is idle codehost host processes).
# ---------------------------------------------------------------------------
code:
  limits:
    memory_mb: 512
  # Cap on waiting for a slot (seconds): how long to wait at most when the concurrency budget is exhausted; beyond it
  # the request gets "busy", never an unbounded block (binding transforms are nested calls, and blocking forever would
  # deadlock on itself).
  # This is the section default; each language can override it with pools.<lang>.acquire_timeout_sec.
  #
  # Why 15 rather than something smaller: python / js only have concurrency budgets of 16 / 8, a single script can
  # itself run for tens of seconds (long tasks), and during a burst the requests queued behind get rejected after
  # waiting 5s — while "busy" means a failed node (the whole workflow fails when on_error.retry is not configured).
  #   The cost must be known too: this wait consumes **no timeout budget** (both code_max_sec and the caller-supplied
  #   code.<lang>.timeout start counting after ready), so it is pure extra tail latency;
  #   and a client waiting for ready has no timeout of its own and its cancellation is not signalled to this service
  #   (see ctx in handle_code.go), so the extra wait shows up as "cancellation is not timely".
  # lua is a microsecond-level high-frequency call with a pool of 32; when real queueing happens, waiting 5s or 15s
  # makes no difference, so it can be configured shorter if contention is observed:
  #   pools.lua.acquire_timeout_sec: 5.
  acquire_timeout_sec: 15
  pools:
    lua:
      # Loop conditions / branch conditions / binding transforms are all high-frequency calls, and the fixed overhead
      # (connection setup + process start) would dwarf lua's own execution time, so the pool is on by default.
      idle:
        initial: 2
        max: 16
      # Must be >= 2: binding transforms are nested calls and occupy two sessions at once
      max_concurrent: 32
      # Cap on waiting for a slot (seconds): defaults to code.acquire_timeout_sec (15); lua is high frequency, so it can
      # be shortened when needed.
      # acquire_timeout_sec: 5

    python:
      idle:
        initial: 1
        max: 8
      max_concurrent: 16

    # js:
    #   idle:
    #     initial: 1
    #     max: 4
    #   max_concurrent: 8

    # How to turn a language off: comment out the **whole** entry (idle included).
    # Commenting out only idle would degrade to the silent performance cliff of "the language still runs but every call
    # cold-starts", which is why that tier does not exist.
    #   ruby:
    #     idle:
    #       initial: 1
    #       max: 4
    #     max_concurrent: 8
    #     acquire_timeout_sec: 5
