# sandboxd for the production stack (deploy/prod). Rendered once by install.sh into /etc/flame/sandboxd.yaml
# and never overwritten by an upgrade: it is host policy, not part of the release.
#
# This service runs bare under systemd (flame-sandboxd.service) because its whole job is `docker run -v
# <host path>`: inside a container the paths stop meaning the same thing, and mounting the daemon socket
# would hand host root to the component that is supposed to be the isolation boundary.

# 0.0.0.0, not 127.0.0.1: the gateways run in containers and the registry probes /healthz from another host.
# A loopback bind works on the single-host tier and fails silently as soon as a second machine registers.
listen: "0.0.0.0:27081"

# Must equal nexus's sandbox.token. Empty would mean "no authentication on an internal port".
token: "${SANDBOX_TOKEN}"

log_dir: "/var/log/flame/sandboxd"

# Registration is on in every tier: tier 1 publishes consul on loopback, tier 2/3 on the intranet NIC, so the
# same file keeps working when a second executor appears.
registry:
  enabled: true
  type: consul
  # Address of the registry as seen *from this host* (tier 1: the loopback publish of the consul container;
  # tier 2/3: the first machine's intranet address). The gateways use a different value - they are
  # containers and reach consul by service name - see FLAME_CONSUL_ADDR_NET.
  address: "${FLAME_CONSUL_ADDR_HOST}"
  service_name: sandboxd
  health_check_path: /healthz
  # service_addr is deliberately absent: it is derived from listen (wildcard -> advertise_iface -> hostname),
  # and the derived value is also what the service id is built from ("sandboxd-<address>-<port>"), which makes
  # it unique per host without any configuration. Writing 127.0.0.1 here with a remote registry refuses to
  # start - on purpose, because the probe would only measure itself.

# docker is the default isolation mode. nsjail is the other option and needs a rootfs exported from the image
# (see nexus/docs/deployment-runbook.md section 5.3); switching mode is one line plus that directory.
mode: docker

# The ceiling of the egress policy, not the fact of one call: the effective value is this ceiling AND the
# tenant capability AND the request's own egress flag. `/v1/code` is always offline in both modes.
network: on-request

docker:
  binary: docker
  image: "flame/sandbox:${FLAME_TAG}"
  # on-request needs a real network to switch to when a request asks for egress; "none" would make that
  # branch impossible and startup refuses the combination.
  network: bridge
  read_only: true
  user: "1000:1000"
  extra_args: []

codehost:
  binary: codehost
  binaries:
    docker: /usr/local/bin/codehost

langs:
  # The names below are guaranteed by the image (sandboxd/Dockerfile symlinks lua and python); they resolve
  # inside the container, not on the host.
  lua:
    command: lua
  python:
    command: python
  js:
    command: node

# The host root of the per-worker writable directories: each worker gets an exclusive subdirectory mounted
# as /tmp and used as the script's cwd. Machine-local and dedicated to this service.
tmp_dir: "/var/lib/flame/sandboxd/tmp"

# Must be literally equal to nexus's storage.root_dir. sandboxd does not interpret the caller's paths, it only
# checks that every bind mount falls inside this range.
allowed_mount_roots:
  - "/srv/flame/data"

# Global hard cap; every request's value is clamped to it.
limits:
  memory_mb: 1024
  cpu_count: 2
  max_pids: 256
  max_file_mb: 64
  timeout_sec: 300
  max_output_bytes: 4194304

# Hard gate on the total duration of one script execution. A caller-supplied timeout can only tighten it.
code_max_sec: 120

# Detail records: off / slow / all. "slow" is the production default; abnormal sessions are always recorded.
code_log: slow
code_log_slow_ms: 200

interactive_idle_sec: 300
interactive_ephemeral_idle_sec: 120
# Not a timeout: the resolution of the idle timeout above. sandboxg validates sticky_ttl_sec against
# interactive_idle_sec + 2x this value, so the two services' numbers have to stay in step.
interactive_janitor_sec: 60

probe:
  timeout_sec: 30
  max_output_bytes: 8192

exec:
  limits:
    memory_mb: 512
    timeout_sec: 120

# Pool policy for workflow snippets. A language is enabled by having an entry here AND in langs above;
# commenting out the whole entry is the only way to turn one off.
code:
  limits:
    memory_mb: 512
  acquire_timeout_sec: 15
  pools:
    lua:
      idle:
        initial: 2
        max: 16
      # Must stay >= 2: binding transforms are nested calls and hold two sessions at once.
      max_concurrent: 32
    python:
      idle:
        initial: 1
        max: 8
      max_concurrent: 16

# nsjail, for reference: only used when mode is switched to nsjail, and only with a rootfs exported from the
# matching image generation (docker export drops the device nodes; codehost needs /dev/null).
# nsjail:
#   binary: nsjail
#   rootfs: /opt/flame/rootfs/<ver>
#   uid: 99999
#   gid: 99999
#   disable_network: true
#   read_only_rootfs: true
#   cgroup_version: auto
