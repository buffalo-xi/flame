# nexus for the production stack (deploy/prod).
#
# Everything in ${...} is expanded by nexus itself from its process environment (container: env_file
# /etc/flame/flame.env). The expander has no default-value syntax, so the variable must be set: an unset one
# becomes an empty string and the service refuses to start, which is the intended failure mode.
#
# The three data-plane addresses are the only fields that change with the tier (single host / extra
# executors / containers on separate machines); keeping them as variables means switching tiers is one edit
# in flame.env, not an edit here.

server:
  name: nexus
  host: 0.0.0.0
  port: 27006
  read_timeout: 30
  write_timeout: 30
  # Served as /static: LLM provider icons and other fixed assets, baked into the image.
  static_root: /opt/flame/static

database:
  type: postgres
  host: "${FLAME_DB_HOST}"
  port: 5432
  username: flame
  password: "${POSTGRES_PASSWORD}"
  database: flame
  platform_schema: platform

redis:
  mode: single
  addrs: ["${FLAME_REDIS_ADDR}"]
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 10
  timeout: 1
  prefix: nexus

logging:
  level: info
  format: text

jwt:
  # Signs every token: rotate it and every session is invalidated at once (acceptable), leak it and anyone
  # can mint a token for any tenant (not acceptable). Generated by install.sh, never a literal.
  secret_key: "${JWT_SECRET}"
  token_expiry: 600
  issuer: "nexus@flame"

security:
  # Encrypts values stored with kind=secret. Must stay stable: changing it makes every stored ciphertext
  # unreadable, and there is no double-key transition in this release.
  value_key: "${FLAME_VALUE_KEY}"

registry:
  # Off: nothing discovers nexus. The gateways and the executors are the registry's clients.
  enabled: false

litellm:
  enabled: true
  url: "http://${FLAME_LITELLM_HOST}:4000"
  master_key: "${LITELLM_MASTER_KEY}"
  # LiteLLM's own database, read directly for spend and key state.
  database: litellm

sandbox:
  # The gateway, not the daemon: it adds discovery, sticky routing and a pool-wide quota.
  #
  # A full URL; empty means "no executor configured". nexus then skips the sandbox readiness gate and reports the
  # sandbox tools as unavailable - what a trial without sandboxd needs. A deployment must set it.
  url: "${FLAME_SANDBOX_URL}"
  # Must equal the executors' token: the gateway presents it to sandboxd, so a mismatch shows up as 401 on
  # every call rather than as a startup error.
  token: "${SANDBOX_TOKEN}"

browser:
  # Same rule as sandbox.url: empty disables the browser tools instead of pointing at a gateway that is not there.
  url: "${FLAME_BROWSER_URL}"
  token: "${BROWSER_TOKEN}"

plugin:
  # Empty = {storage.root_dir}/plugins, which is on the shared storage and survives image rebuilds.
  dir: ""
  python: python3
  timeout: 30
  refresh_interval: 60

storage:
  # Holds tenants/ (one directory per tenant schema), platform-assets/ and plugins/. The same directory is
  # mounted into sandboxd (allowed_mount_roots) and browserd (workspace_root) at this exact absolute path;
  # that identity is what makes "the sandbox writes a file, the tenant downloads it" work.
  root_dir: /srv/flame/data
  driver: local
  s3:
    # driver is local, so these are never read. Left empty rather than ${S3_*}: an unset variable fails the
    # config load, and this deployment has no object storage to point at.
    bucket: ""
    prefix: ""
    region: cn-north-1
    endpoint: ""
    access_key: ""
    secret_key: ""

download:
  # nginx serves the bytes straight from disk (sendfile, Range supported); nexus only sends the redirect.
  # The matching nginx location is `location /__files/ { internal; alias /srv/flame/data/; }`.
  x_accel_prefix: /__files
  presign_download: false
  presign_probe_key: ""
  presign_ttl: 300
  max_download_size: 100
