# 27443: the optional TLS overlay. NOT installed by default - the web container's entrypoint links this file
# into conf.d only when both /etc/nginx/tls/fullchain.pem and privkey.pem exist.
#
# Why optional rather than always on: `listen ... ssl` with a missing certificate makes nginx exit with
# "[emerg] cannot load certificate", i.e. the whole entry point would be down because a file is absent. TLS
# is terminated here; nexus itself has no TLS code and speaks plain HTTP behind this block.

server {
    listen 27443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # TLS 1.2 is kept for older enterprise clients; 1.3 is preferred.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Worth having: a reused connection is what makes the websocket channels cheap.
    ssl_session_cache shared:flame_ssl:10m;
    ssl_session_timeout 1h;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    include /etc/nginx/flame/locations.inc;
}
