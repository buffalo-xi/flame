# http-level definitions shared by every server block. Loaded once, from conf.d, which nginx includes inside
# the http context - a `map` can only be defined once per configuration, so a copy inside each server block
# would fail with "duplicate map".

# Websocket upgrade. `/nexus/ws` and `/nexus/debug` are websockets, so the connection header has to follow the
# request instead of being a fixed "upgrade".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The scheme the client actually used. Behind an upstream load balancer (scenario C in the deployment doc)
# $scheme is always http, and every generated link would carry the wrong scheme.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}
