# 27001: the full-capability entry point. Always installed.
#
# Where it is reachable from is decided by the publish mapping in compose (FLAME_PUBLISH_IP), not here: the
# container listens on 27001 and the host decides whether that is the intranet address, loopback (behind an
# upstream load balancer) or the world.
#
# Full capability means a plaintext Bearer token on the wire. Tiers 1-2 therefore keep this port on the
# intranet, and only a deployment with a certificate (27443, see flame-tls.conf) exposes it to an untrusted
# network.

server {
    listen 27001;
    server_name _;

    # Debian's/alpine's nginx.conf logs to files, where `docker logs web` would never see them.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    # Workspace uploads go through nexus; the browser tool's screenshots come back the other way.
    client_max_body_size 200m;

    include /etc/nginx/flame/locations.inc;
}
