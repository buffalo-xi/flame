# sandboxd for the PoC (deploy/poc).
#
# mode: none — the sandbox *is* the container here. There is no second isolation boundary to build inside an already
# isolated box, so the "isolation" is the container itself: the agent's shell runs as the container user with access to
# /data. That is acceptable for a single-tenant demo and is exactly why the port must not be exposed to the internet.
# Switching to nsjail later means: build a rootfs into the image, add --cap-add SYS_ADMIN, and change mode + langs
# (nothing else in this file moves).

listen: "127.0.0.1:27081"
token: ""

# No consul: nexus connects to this one instance directly.
registry:
  enabled: false

log_dir: /var/log/flame

code_log: slow
code_log_slow_ms: 200

mode: none

# Declared honestly: with mode=none the scripts are ordinary processes of this container and the network cannot be cut
# off. sandboxd refuses to start when the declaration contradicts how the unit is actually started.
network: on-request
networks:
  none: on

probe:
  timeout_sec: 30
  max_output_bytes: 8192

# Interpreter entry names, resolved inside the container.
#   lua: the image symlinks /usr/local/bin/lua -> /usr/bin/lua5.4
#   python: python3 — Debian 13's 3.13, the same generation as the sandbox contract in sandboxd/Dockerfile, with
#           openpyxl / xlrd / pandas / numpy / requests / python-docx / beautifulsoup4 preinstalled. The set is fixed at
#           build time on purpose: a docker-mode sandbox cannot pip-install at runtime, so a script must not depend on
#           "I will just install it here".
#           `docker exec <container> cat /etc/flame-versions` prints what is actually in the image.
# js (node) is deliberately absent: node is not installed in this image, and sandboxd refuses to start with a language
# it cannot resolve. Add nodejs to the image and uncomment the block to enable javascript.
langs:
  lua:
    command: lua
  python:
    command: python3
  # js:
  #   command: node

codehost:
  binary: codehost
  binaries:
    none: /opt/flame/bin/codehost
    nsjail: /usr/local/bin/codehost
    docker: /usr/local/bin/codehost

# Worker scratch area: every worker gets an exclusive subdirectory, mounted as /tmp inside the sandbox and used as the
# script's cwd. Leftover codehost-* directories from a previous run are removed at startup. Not a data directory.
tmp_dir: /tmp/flame-sandbox

# The only host tree a request may mount from. Must be the same absolute path nexus uses for storage.root_dir — the
# mount check compares strings, so "/data" here and "/data/tenants/..." in the request only line up if both see /data.
allowed_mount_roots:
  - /data

nsjail:
  binary: nsjail
  rootfs: /opt/nsjail/rootfs
  uid: 99999
  gid: 99999
  disable_network: true
  read_only_rootfs: true
  cgroup_version: auto
  extra_args: []

docker:
  binary: docker
  image: flame/sandbox:latest
  network: bridge
  read_only: true
  user: "1000:1000"
  extra_args: []

limits:
  memory_mb: 1024
  cpu_count: 2
  max_pids: 256
  max_file_mb: 64
  timeout_sec: 300
  max_output_bytes: 4194304

code_max_sec: 120

interactive_idle_sec: 300
interactive_ephemeral_idle_sec: 120
interactive_janitor_sec: 60

exec:
  limits:
    memory_mb: 512
    timeout_sec: 120

code:
  limits:
    memory_mb: 512
  acquire_timeout_sec: 15
  pools:
    lua:
      idle:
        initial: 2
        max: 16
      max_concurrent: 32
    python:
      idle:
        initial: 1
        max: 8
      max_concurrent: 16
