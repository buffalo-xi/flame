; Process supervision for the Flame container of the PoC (the LiteLLM gateway is a separate container).
;
; supervisord is PID 1 of the container: it restarts a crashed service, forwards SIGTERM to the children on
; `docker stop`, and reaps zombies. It only starts things — the ordering guarantee lives in entrypoint.sh, which brings
; postgres up, applies the SQL and shuts it down again before this process starts.
;
; Everything logs to the container's stdout/stderr so `docker logs flame` shows the whole stack in one stream.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/var/log/flame
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---------------------------------------------------------------------------
; Infrastructure
; ---------------------------------------------------------------------------
; listen_addresses is 0.0.0.0, not 127.0.0.1: the LiteLLM container connects over the compose network (the pg_hba line
; entrypoint.sh appends is what admits it). Nothing is published to the host.
[program:postgres]
command=/usr/local/bin/flame-gosu postgres /usr/local/bin/flame-pg -D /data/pg -c listen_addresses=0.0.0.0 -c port=5432 -c unix_socket_directories=/tmp
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
; SIGINT is postgres' "fast shutdown": it completes the current statement and exits cleanly. SIGTERM would be "smart
; shutdown" and wait for every client to disconnect, which turns `docker stop` into a 10 second timeout.
stopsignal=INT
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --daemonize no
priority=15
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The LLM gateway is not supervised here: it runs as its own container (see docker-compose.yml). Nothing in this file
; knows about it; nexus only knows `litellm.url` from its own config.

; ---------------------------------------------------------------------------
; Flame services
; ---------------------------------------------------------------------------
[program:nexus]
; nexus takes no -config flag: it loads ./config.yaml from the working directory, so the directory *is* the argument.
command=/opt/flame/bin/nexus
directory=/etc/flame/nexus
; After the infrastructure (postgres 10 / redis 15), before nginx (50). Without this line the default of 999 starts nexus
; last, so nginx accepts requests first and answers 502 for the first seconds of every container start.
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:sandboxd]
; One config per service in its own directory (/etc/flame/<service>/config.yaml), the same shape nexus uses.
command=/opt/flame/bin/sandboxd -config /etc/flame/sandboxd/config.yaml
directory=/opt/flame
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:browserd]
command=/opt/flame/bin/browserd -config /etc/flame/browserd/config.yaml
directory=/opt/flame
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
startsecs=2
; SIGQUIT is nginx' graceful shutdown.
stopsignal=QUIT
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
