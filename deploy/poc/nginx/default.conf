# The only entry point of the PoC box: the desktop bundle on /, everything else proxied to nexus.
#
# The frontend calls the API through a relative prefix (/nexus, see desktop/public/config.js and the Vite dev proxy),
# and the prefix is *stripped* before it reaches nexus: nexus serves /admin, /platform, /service, /ws, /debug and
# /health at its root. `proxy_pass .../;` with the trailing slash is what performs the strip — drop it and every call
# becomes 404.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 27001;
    server_name _;

    # Debian's nginx.conf logs to files (/var/log/nginx/*.log), so `docker logs flame` would miss every request and every
    # startup error; supervisord only forwards the process' own stdout/stderr. These two lines are what put them in it.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    # Workspace uploads go through nexus; the browser tool's screenshots come back the other way.
    client_max_body_size 200m;

    # Liveness/readiness for `docker inspect` and the compose healthcheck: nginx is up AND nexus is ready (nexus answers
    # 503 until postgres, redis and litellm are all reachable).
    location = /healthz {
        proxy_pass http://127.0.0.1:27006/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # The API. Both websocket families live under here too (/ws, /debug), hence the upgrade headers and the long read
    # timeout: a debug channel sits idle while a flow runs, and the default 60s would cut it.
    location /nexus/ {
        proxy_pass http://127.0.0.1:27006/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # `/nexus` without the trailing slash: browsers and hand-written curl calls both hit this, and proxying it as-is
    # would strip the prefix and turn "" into "/" (fine) or produce a 404 on stricter setups — redirect instead.
    location = /nexus {
        return 301 /nexus/;
    }

    # The tenant service API: external callers present an API key (or OAuth) instead of a console session, and the tenant
    # is a path segment (`/service/mcp/<schema>`, `/service/rpc/<schema>`). This prefix is *not* stripped — nexus serves
    # exactly `/service/...`, so `proxy_pass` deliberately has no trailing slash here (one would turn
    # `/service/mcp/t0` into `/mcp/t0` and 404). No upgrade headers: neither protocol keeps a websocket open.
    location /service/ {
        proxy_pass http://127.0.0.1:27006;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Downloads: nexus answers with `X-Accel-Redirect: /__files/<path under storage.root_dir>` and nginx serves the bytes
    # straight from disk (sendfile, Range supported), so a 100 MB file never enters the Go process.
    # `internal` is what makes this safe: the path cannot be requested from outside, only reached through the redirect.
    location /__files/ {
        internal;
        alias /data/;
    }

    # The SPA: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
