name: prod-images

# The production images, published so a target host needs no toolchain:
#
#   docker login ghcr.io
#   sudo ./scripts/install.sh --tag <tag> --registry ghcr.io/<owner>/flame
#
# Trigger is a release tag, not a push: `FLAME_TAG` is the whole upgrade/rollback mechanism, so an image that moves
# under a tag somebody already deployed is the one thing this workflow must never do. A manual run takes the tag as an
# input and produces exactly the same five images.
#
# One manual step no workflow can do (the PoC image has the same note): a GHCR package is private even when the
# repository is public. After the first run, open the package (repository page -> Packages) and set its visibility -
# otherwise `docker pull` for someone outside the organisation fails with "unauthorized". The release tarball itself
# needs no such step; it is a normal release asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (becomes FLAME_TAG; must not be reused)'
        required: true

concurrency:
  group: prod-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the reason this job exists: pushing to ghcr.io
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # One namespace for all five images, so compose needs one variable (FLAME_IMAGE_NS) rather than five.
      NS: ghcr.io/${{ github.repository_owner }}/flame
    steps:
      - uses: actions/checkout@v4

      # The images contain the products, they do not compile them: nexus/base/gateway/web Dockerfiles COPY out/, and
      # sandboxd/Dockerfile COPYs sandboxd/bin/codehost-linux. Both are what this step writes.
      - uses: actions/setup-go@v5
        with:
          go-version-file: nexus/go.mod
          cache-dependency-path: nexus/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Two products in one pass: the images below COPY out/, and the tarball is what a user downloads instead of
      # installing a toolchain. --no-images, because the images are pushed by buildx in the steps after this one.
      - name: Build the products and the host bundle
        run: ./scripts/release.sh --tag "$TAG" --no-images
        working-directory: deploy/prod

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # base goes first and is pushed before the others are built: they are FROM it, and building them against a local
      # base that was never pushed would produce images this registry cannot explain.
      - name: Build and push the base
        uses: docker/build-push-action@v6
        with:
          context: deploy/prod/images
          file: deploy/prod/images/base.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.NS }}/base:${{ env.TAG }}

      - name: Build and push nexus
        uses: docker/build-push-action@v6
        with:
          context: deploy/prod
          file: deploy/prod/images/nexus.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.NS }}/nexus:${{ env.TAG }}
          build-args: |
            FLAME_TAG=${{ env.TAG }}
            FLAME_BASE=${{ env.NS }}/base

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: deploy/prod
          file: deploy/prod/images/gateway.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.NS }}/gateway:${{ env.TAG }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: deploy/prod
          file: deploy/prod/images/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.NS }}/web:${{ env.TAG }}

      # The sandbox image is built from sandboxd/Dockerfile as it stands, with sandboxd/ as the context: that
      # Dockerfile COPYs bin/codehost-linux from it, and a build from the repository root would silently produce an
      # image without codehost.
      - name: Build and push sandbox
        uses: docker/build-push-action@v6
        with:
          context: sandboxd
          file: sandboxd/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.NS }}/sandbox:${{ env.TAG }}
          # First build ~10 min (apt + Python packages), later ones are cache hits on the unchanged layers.
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            for img in base nexus gateway web sandbox; do echo "$NS/$img:$TAG"; done
            echo '```'
            echo
            echo "On the target host: \`sudo ./scripts/install.sh --tag $TAG --registry $NS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Also on the run page, so a manual run (no tag, no release) still produces something downloadable.
      - name: Upload the host bundle
        uses: actions/upload-artifact@v4
        with:
          name: flame-prod-${{ env.TAG }}
          path: |
            deploy/prod/release/flame-prod-*.tar.gz
            deploy/prod/release/SHA256SUMS
          if-no-files-found: error

      # Only for a real tag. This tarball is the host side of a deployment - the two executor binaries that cannot be
      # containers, the units, the config templates and the scripts - and it is deliberately the whole answer a user
      # needs besides the images: download, extract, one install command.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/prod/release/flame-prod-*.tar.gz
            deploy/prod/release/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Images (linux/amd64, `${{ env.TAG }}`): `${{ env.NS }}/{base,nexus,gateway,web,sandbox}`

            On a fresh host, as root:

            ```bash
            mkdir -p /srv/flame/dist && cd /srv/flame/dist
            curl -fLO ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/flame-prod-${{ env.TAG }}.tar.gz
            tar -xzf flame-prod-${{ env.TAG }}.tar.gz
            sudo ./scripts/install.sh --tag ${{ env.TAG }} --check --registry ${{ env.NS }}
            sudo ./scripts/install.sh --tag ${{ env.TAG }} --registry ${{ env.NS }}
            ```

            Then the start order is in `nexus/docs/deployment-runbook.md` section 7.1 (data plane, migrate, bootstrap,
            executors, application plane, `health.sh`).
