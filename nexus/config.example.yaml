## flux/nexus 配置模板
##
## 用法：cp nexus/config.example.yaml nexus/config.yaml，然后按需修改。
## 真正的 nexus/config.yaml 不入库（见 .gitignore）——它是本机实际配置，
## 含 JWT 签名密钥这类真东西。
##
## ${VAR} 会在 YAML 解析前被环境变量替换（见 nexus/shared/config/config.go 的 expandEnv）。
## 引用的变量没设置就展开成空串，多数必填项会因此拒绝启动 —— 这是有意的：
## 静默用默认值比启动失败更难查。

server:
  name: nexus
  port: 27006
  host: 0.0.0.0
  read_timeout: 30
  write_timeout: 30
  static_root: "static"

database:
  type: postgres
  host: localhost
  port: 5432
  username: postgres
  password: pg
  database: flame
  platform_schema: "platform"

# Redis：必须依赖（跨实例运行台账 / 停止信号广播 / 配额计数）。
# 没有 enabled 开关 —— 连不上就不就绪，除 /health 外一律 503。
redis:
  mode: single
  addrs:
    - localhost:6379
  password: ""
  db: 0
  pool_size: 10
  timeout: 1
  prefix: "nexus"

logging:
  level: info
  format: text

jwt:
  # 签名密钥（HS256）。必须显式配置为随机值：
  #   本值泄露 = 任何人可自签 token（claims 含 schema）→ 可操作任意租户的后台。
  # 生成（任选其一）：
  #   openssl rand -base64 48
  #   PowerShell: [Convert]::ToBase64String([byte[]](1..48 | ForEach-Object { Get-Random -Maximum 256 }))
  # 更换该值会让所有已签发的 token 立即失效（需要重新登录）。
  # 空值 / 仍是默认值 / 含 CHANGE_ME / 长度 < 32 都会导致服务拒绝启动。
  secret_key: "${JWT_SECRET}"
  token_expiry: 600      # 单位：分钟（600 = 10 小时）
  issuer: "nexus@flame"

# 敏感配置值的静态加密：{schema}.global_vars 里 kind=secret 的 value。
# 留空 = 从 jwt.secret_key 派生，开箱可用；代价是「换 jwt.secret_key」会让已加密的
# 值全部解不开。生产环境建议单独配一个，与登录密钥解耦（生成：openssl rand -base64 48）。
security:
  value_key: "${FLAME_VALUE_KEY}"

registry:
  enabled: false
  type: consul
  address: localhost:8500
  service_name: nexus
  service_addr: http://localhost
  service_port:
  tags:
    - api
    - nexus

# MCP 2.0 Server 端点常驻：/service/mcp/{schema}（租户由路径段携带）。
# RPC Server 端点常驻：/service/rpc/{schema}（租户由路径段携带）。
# 无进程级开关 —— 是否对某个租户开放由租户级配置决定。这一段刻意没有配置项。

# LiteLLM Proxy 网关配置（模型调用的统一出口）
litellm:
  enabled: true
  url: "http://localhost:4000"
  master_key: "${LITELLM_MASTER_KEY}"
  database: "litellm"

# 进程沙箱配置
# nexus 侧不做隔离、不持有池：所有执行都委托给独立的 sandboxd 服务。
# 隔离方式（none / nsjail / docker）、资源上限、worker 池与并发策略
# 全部由 sandboxd 自己的配置决定 —— 这里只给出「连到哪里」。
sandbox:
  # 沙箱服务基地址（不含路径），nexus 按用途拼出两条路由：
  #   /v1/exec —— 一次性命令执行（agent 的 exec / run_skill_script，argv 由调用方给全）
  #   /v1/code —— 托管代码片段（工作流 code / 分支 / 循环 / binding，解释器由服务端定）
  # 两条路由在同一台 sandboxd 上（同一 listen、同一份策略），故只配一份基地址。
  url: "ws://127.0.0.1:27080"
  # 需与 sandboxd 的 token 一致；留空表示不鉴权（仅限内网）
  token: ""

# 插件：磁盘上的 Python 插件（自注册工具面与实现），nexus 只负责发现 / 配置 / 调度。
# 目录结构：{dir}/<kind>/<tool>/tool.py + {dir}/<kind>/<tool>/<impl>/plugin.py
plugin:
  # 空 = {agent.root_dir}/plugins；也可写绝对路径
  dir: ""
  # 解释器命令；Windows 上通常是 python
  python: "python"
  # 单次调用超时（秒）
  timeout: 30
  # manifest 刷新间隔（秒）；目录 mtime 变化时会立即重扫
  refresh_interval: 60

agent:
  # 租户工作区根目录（每个租户一个 schema 目录）。
  # ⚠️ 模板里给的是相对路径，实际部署请改成该机器的数据盘路径。
  root_dir: ./data
  storage:
    driver: local  # local nfs s3
    s3:
      bucket: agent-platform-data
      prefix: ""
      region: cn-north-1
      endpoint: ""
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
  # 工作区文件「下载」的交付方式（只影响下载，预览与上传不受影响）
  http:
    # 有 nginx 时填内部路径前缀（如 /__files），下载交给 nginx 从磁盘直接发（sendfile、支持 Range）：
    #   nginx: location /__files/ { internal; alias <root_dir>/; }
    # 留空 = 由 nexus 用 http.ServeContent 发送（本地开发无需 nginx）。
    x_accel_prefix: ""
    # 对象存储（driver: s3）可选：开启后下载直接 302 到预签名 URL。
    presign_download: false
    presign_probe_key: ""
    presign_ttl: 300
    max_download_size: 100
