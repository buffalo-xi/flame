## flame/nexus configuration template
##
## Usage: cp nexus/config.example.yaml nexus/config.yaml, then edit as needed.
## The real nexus/config.yaml is not committed (see .gitignore) — it is this machine's actual config,
## holding things like the JWT signing key.
##
## ${VAR} is replaced from the environment before the YAML is parsed (see expandEnv in nexus/shared/config/config.go).
## An unset variable expands to an empty string, which makes most required settings refuse to start — deliberately:
## silently falling back to a default is harder to diagnose than a startup failure.

server:
  name: nexus
  port: 27006
  host: 0.0.0.0
  read_timeout: 30
  write_timeout: 30
  static_root: "static"

database:
  type: postgres
  host: localhost
  port: 5432
  username: postgres
  password: pg
  database: flame
  platform_schema: "platform"

# Redis: a hard dependency (cross-instance run ledger / stop-signal broadcast / quota counters).
# There is no enabled switch — when it is unreachable the service is not ready and answers 503 for everything but
# /health.
redis:
  mode: single
  addrs:
    - localhost:6379
  password: ""
  db: 0
  pool_size: 10
  timeout: 1
  prefix: "nexus"

logging:
  level: info
  format: text

jwt:
  # Signing key (HS256). It must be configured explicitly as a random value:
  #   leaking it = anyone can mint their own token (with a schema in the claims) → any tenant's backend is exposed.
  # Generate it (either way):
  #   openssl rand -base64 48
  #   PowerShell: [Convert]::ToBase64String([byte[]](1..48 | ForEach-Object { Get-Random -Maximum 256 }))
  # Changing this value invalidates every issued token immediately (a fresh login is required).
  # Empty / still the default / containing CHANGE_ME / shorter than 32 all make the service refuse to start.
  secret_key: "${JWT_SECRET}"
  token_expiry: 600      # in minutes (600 = 10 hours)
  issuer: "nexus@flame"

# Static encryption of sensitive config values: the value where kind=secret in {schema}.global_vars.
# Empty = derived from jwt.secret_key, which works out of the box; the cost is that changing jwt.secret_key makes
# everything already encrypted undecryptable. In production configure a separate one, decoupled from the login key
# (generate: openssl rand -base64 48).
security:
  value_key: "${FLAME_VALUE_KEY}"

registry:
  enabled: false
  type: consul
  address: localhost:8500
  service_name: nexus
  service_addr: http://localhost
  service_port:
  tags:
    - api
    - nexus

# The MCP 2.0 Server endpoint is always mounted: /service/mcp/{schema} (the tenant comes from the path segment).
# The RPC Server endpoint is always mounted: /service/rpc/{schema} (the tenant comes from the path segment).
# No process-level switch — whether a tenant may use it is decided by its tenant-level config. This section
# deliberately has no options.

# LiteLLM Proxy gateway config (the single egress for model calls)
litellm:
  enabled: true
  url: "http://localhost:4000"
  master_key: "${LITELLM_MASTER_KEY}"
  database: "litellm"

# Process sandbox config
# The nexus side does no isolation and holds no pool: every execution is delegated to the standalone sandboxd service.
# The isolation mode (none / nsjail / docker), the resource caps, the worker pool and the concurrency policy are all
# decided by sandboxd's own config — here we only say "where to connect".
sandbox:
  # Sandbox service base address (without a path); nexus composes two routes from it by purpose:
  #   /v1/exec — one-shot command execution (the agent's exec / run_skill_script; the caller supplies the full argv)
  #   /v1/code — managed snippets (workflow code / branch / loop / binding; the server picks the interpreter)
  # Both routes live on the same sandboxd (same listen, same policy), hence a single base address.
  url: "ws://127.0.0.1:27080"
  # Must match sandboxd's token; empty means no authentication (internal network only)
  token: ""

# Plugins: Python plugins on disk (they self-register their tool surface and implementation); nexus only discovers,
# configures and schedules them.
# Layout: {dir}/<kind>/<tool>/tool.py + {dir}/<kind>/<tool>/<impl>/plugin.py
plugin:
  # Empty = {agent.root_dir}/plugins; an absolute path works too
  dir: ""
  # Interpreter command; usually python on Windows
  python: "python"
  # Timeout of a single call (seconds)
  timeout: 30
  # Manifest refresh interval (seconds); a change in the directory mtime triggers an immediate rescan
  refresh_interval: 60

agent:
  # Tenant workspace root (one schema directory per tenant).
  # ⚠️ The template gives a relative path; in a real deployment change it to this machine's data volume path.
  root_dir: ./data
  storage:
    driver: local  # local nfs s3
    s3:
      bucket: agent-platform-data
      prefix: ""
      region: cn-north-1
      endpoint: ""
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
  # Delivery of workspace file "downloads" (affects downloads only; preview and upload are unaffected)
  http:
    # With nginx in front, put the internal path prefix here (for example /__files) and let nginx serve downloads
    # straight from disk (sendfile, Range supported):
    #   nginx: location /__files/ { internal; alias <root_dir>/; }
    # Empty = nexus serves them with http.ServeContent (local development needs no nginx).
    x_accel_prefix: ""
    # Object storage (driver: s3), optional: when enabled, downloads 302 straight to a presigned URL.
    presign_download: false
    presign_probe_key: ""
    presign_ttl: 300
    max_download_size: 100
